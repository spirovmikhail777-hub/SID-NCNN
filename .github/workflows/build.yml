name: Build SID-NCNN APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. Устанавливаем JDK 17 ТОЛЬКО для настройки Android SDK
    - name: Set up JDK 17 (for SDK)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # 2. Устанавливаем NDK, пока активен JDK 17
    - name: Install NDK r21
      run: |
        yes | sdkmanager --install "ndk;21.4.7075529"

    # 3. Переключаемся на JDK 11 для сборки Gradle
    - name: Set up JDK 11 (for Build)
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: ./Camera2Raw

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace
      working-directory: ./Camera2Raw

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SID-NCNN-Debug-APK
        path: ./Camera2Raw/app/build/outputs/apk/debug/*.apk
