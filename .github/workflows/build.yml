name: Build SID-NCNN APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6 # Обновлено с v4

    - name: Set up JDK 17 (for SDK)
      uses: actions/setup-java@v5 # Обновлено с v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4 # Оставляем v4, это актуальная версия[reference:9]
      with:
        packages: 'platform-tools'

    - name: Install NDK r21
      run: |
        yes | sdkmanager --install "ndk;21.4.7075529"

    - name: Set up JDK 11 (for Build)
      uses: actions/setup-java@v5 # Обновлено с v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: ./Camera2Raw

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace
      working-directory: ./Camera2Raw

    - name: Upload APK
      uses: actions/upload-artifact@v6 # Обновлено с v4
      with:
        name: SID-NCNN-Debug-APK
        path: ./Camera2Raw/app/build/outputs/apk/debug/*.apk
